<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Notes & Lists</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="login-overlay visible" id="loginOverlay">
        <section class="auth-card" aria-labelledby="authTitle">
            <h1 id="authTitle"><i class="fas fa-sticky-note"></i> Notes</h1>
            <p class="auth-subtitle">Sign in to your personal workspace</p>
            <p class="auth-message auth-error" id="authError"></p>
            <p class="auth-message auth-success" id="authSuccess"></p>
            <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
                <input id="loginUsername" autocomplete="username" placeholder="Username" required>
                <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" required>
                <button class="auth-btn" type="submit">Log in</button>
                <button class="auth-link" type="button" onclick="showSignupForm()">Create an account</button>
            </form>
            <form id="signupForm" style="display:none" onsubmit="event.preventDefault(); handleSignup();">
                <input id="signupUsername" autocomplete="username" placeholder="Username" required>
                <input id="signupPassword" type="password" autocomplete="new-password" placeholder="Password" required>
                <input id="signupConfirmPassword" type="password" autocomplete="new-password" placeholder="Confirm password" required>
                <button class="auth-btn" type="submit">Create account</button>
                <button class="auth-link" type="button" onclick="showLoginForm()">Back to login</button>
            </form>
            <form id="changePasswordForm" style="display:none" onsubmit="event.preventDefault(); handleChangePassword();">
                <h2>Change password</h2><input id="changeCurrentPassword" type="password" placeholder="Current password" required>
                <input id="changeNewPassword" type="password" placeholder="New password" required>
                <input id="changeConfirmNewPassword" type="password" placeholder="Confirm new password" required>
                <button class="auth-btn" type="submit">Update password</button><button class="auth-link" type="button" onclick="hideLoginOverlay()">Cancel</button>
            </form>
            <form id="deleteAccountForm" style="display:none" onsubmit="event.preventDefault(); handleDeleteAccount();">
                <h2>Delete account</h2><p class="auth-subtitle">This permanently removes your notes.</p>
                <input id="deleteUsername" readonly><input id="deletePassword" type="password" placeholder="Current password" required>
                <button class="auth-btn danger" type="submit">Delete my account</button><button class="auth-link" type="button" onclick="hideLoginOverlay()">Cancel</button>
            </form>
            <section id="adminPanel" style="display:none"><h2>Admin panel</h2><p class="auth-subtitle">Manage user accounts.</p><div id="adminLoading">Loading users...</div><div id="adminUserList"></div><button class="auth-link" type="button" onclick="hideAdminPanel()">Close</button></section>
            <div style="margin-top: 1rem; text-align: center; border-top: 1px solid #2a2a1a; padding-top: 1rem;">
                <button class="auth-link" type="button" onclick="useOffline()" style="font-size: 0.85rem;"><i class="fas fa-database"></i> Continue offline</button>
            </div>
        </section>
    </div>

    <div class="sidebar-toggle-wrapper">
        <button id="toggleSidebarBtn"><i class="fas fa-bars"></i> <span>Notes</span></button>
    </div>

    <div class="save-indicator" id="saveIndicator">
        <i class="fas fa-check-circle"></i> Saved
    </div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="status-panel" id="statusPanel">
                <div class="status-info">
                    <i class="fas fa-cloud"></i>
                    <span id="statusText">Cloud sync: <span class="disconnected">not configured</span></span>
                </div>
                <div class="user-actions" id="userActions" style="display:none"><span id="currentUserDisplay"></span><button class="user-action-btn" onclick="showChangePasswordLoggedIn()" title="Change password"><i class="fas fa-key"></i></button><button class="user-action-btn" id="deleteMyAccountBtn" onclick="showDeleteOwnAccount()" title="Delete my account"><i class="fas fa-trash-alt"></i></button><button class="user-action-btn" id="adminPanelBtn" onclick="showAdminPanel()" title="Admin panel" style="display:none"><i class="fas fa-shield-alt"></i></button><button class="user-action-btn" onclick="handleLogout()" title="Log out"><i class="fas fa-sign-out-alt"></i></button></div><div class="status-actions">
<button onclick="pullNow()" id="pullBtn"><i class="fas fa-download"></i> Pull</button>
                    <button onclick="pushNow()" id="pushBtn"><i class="fas fa-upload"></i> Push</button>
                </div>
            </div>
            <button class="sidebar-close-btn" id="sidebarCloseBtn" title="Close sidebar">
                <i class="fas fa-times"></i>
            </button>
            <div id="sidebarSectionsContainer"></div>
            <button class="add-section-btn" id="addSectionBtn"><i class="fas fa-plus-circle"></i> Add section</button>
        </div>
    </aside>

    <main class="main" id="mainContent">
        <div id="mainSectionsContainer"></div>
    </main>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
    <script src="ui.js"></script>
    <script src="crud.js"></script>
    <script src="shared.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        initAuth();
        initSyncButtons();
        const addBtn = document.getElementById('addSectionBtn');
        if (addBtn) {
            addBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                const name = prompt('Enter section name:');
                if (name && name.trim()) {
                    const idx = sections.length;
                    const size = getDefaultBoxSize(idx);
                    sections.push({
                        id: genId(),
                        name: name.trim(),
                        subs: [],
                        notes: [],
                        items: [],
                        width: size.width,
                        height: size.height,
                        x: size.x,
                        y: size.y
                    });
                    render();
                    const newSection = sections[sections.length - 1];
                    if (newSection) {
                        selectSection(newSection.id);
                    }
                }
            });
        }

        const toggleBtn = document.getElementById('toggleSidebarBtn');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', function() {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('hidden');
                this.innerHTML = sidebar.classList.contains('hidden') ?
                    '<i class="fas fa-chevron-right"></i> <span>Notes</span>' :
                    '<i class="fas fa-bars"></i> <span>Notes</span>';
            });
        }

        const closeBtn = document.getElementById('sidebarCloseBtn');
        if (closeBtn) {
            closeBtn.addEventListener('click', function() {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.add('hidden');
                const toggleBtn = document.getElementById('toggleSidebarBtn');
                if (toggleBtn) {
                    toggleBtn.innerHTML = '<i class="fas fa-chevron-right"></i> <span>Notes</span>';
                }
            });
        }
    });

    window.addSectionFromMain = function() {
        const name = prompt('Section name:');
        if (name && name.trim()) {
            const idx = sections.length;
            const size = getDefaultBoxSize(idx);
            sections.push({
                id: genId(),
                name: name.trim(),
                subs: [],
                notes: [],
                items: [],
                width: size.width,
                height: size.height,
                x: size.x,
                y: size.y
            });
            render();
            const newSection = sections[sections.length - 1];
            if (newSection) selectSection(newSection.id);
        }
    };
    </script>

</body>
</html>
