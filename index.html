<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Notes & Lists</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ============================================================
         LOGIN OVERLAY
         ============================================================ -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-modal">
            <div class="login-header">
                <i class="fas fa-sticky-note"></i>
                <h2>Notes & Lists</h2>
                <p>Sign in to access your notes</p>
            </div>

            <!-- Error / Success Messages -->
            <div class="auth-message auth-error" id="authError"></div>
            <div class="auth-message auth-success" id="authSuccess"></div>

            <!-- ===== LOGIN FORM ===== -->
            <div class="auth-form" id="loginForm">
                <div class="auth-field">
                    <i class="fas fa-user"></i>
                    <input type="text" id="loginUsername" placeholder="Username" autocomplete="username" />
                </div>
                <div class="auth-field">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" />
                </div>
                <button class="auth-btn" onclick="handleLogin()">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
                <div class="auth-links">
                    <a href="#" onclick="showSignupForm(); return false;">Create new account</a>
                    <a href="#" onclick="showChangePasswordForm(); return false;">Change password</a>
                </div>
            </div>

            <!-- ===== SIGNUP FORM ===== -->
            <div class="auth-form" id="signupForm" style="display:none;">
                <div class="auth-field">
                    <i class="fas fa-user"></i>
                    <input type="text" id="signupUsername" placeholder="Choose a username" autocomplete="off" />
                </div>
                <div class="auth-field">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="signupPassword" placeholder="Password (min 3 chars)" autocomplete="new-password" />
                </div>
                <div class="auth-field">
                    <i class="fas fa-check-circle"></i>
                    <input type="password" id="signupConfirmPassword" placeholder="Confirm password" autocomplete="new-password" />
                </div>
                <button class="auth-btn" onclick="handleSignup()">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
                <div class="auth-links">
                    <a href="#" onclick="showLoginForm(); return false;">Already have an account? Sign in</a>
                </div>
            </div>

            <!-- ===== CHANGE PASSWORD FORM ===== -->
            <div class="auth-form" id="changePasswordForm" style="display:none;">
                <div class="auth-field">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="changeCurrentPassword" placeholder="Current password" autocomplete="current-password" />
                </div>
                <div class="auth-field">
                    <i class="fas fa-key"></i>
                    <input type="password" id="changeNewPassword" placeholder="New password (min 3 chars)" autocomplete="new-password" />
                </div>
                <div class="auth-field">
                    <i class="fas fa-check-circle"></i>
                    <input type="password" id="changeConfirmNewPassword" placeholder="Confirm new password" autocomplete="new-password" />
                </div>
                <button class="auth-btn" onclick="handleChangePassword()">
                    <i class="fas fa-save"></i> Change Password
                </button>
                <div class="auth-links">
                    <a href="#" onclick="showLoginForm(); return false;">Back to sign in</a>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================
         SIDEBAR TOGGLE
         ============================================================ -->
    <div class="sidebar-toggle-wrapper">
        <button id="toggleSidebarBtn"><i class="fas fa-bars"></i> <span>Notes</span></button>
    </div>

    <!-- ============================================================
         SAVE INDICATOR
         ============================================================ -->
    <div class="save-indicator" id="saveIndicator">
        <i class="fas fa-check-circle"></i> Saved
    </div>

    <!-- ============================================================
         SIDEBAR
         ============================================================ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="status-panel" id="statusPanel">
                <div class="status-info">
                    <i class="fas fa-cloud"></i>
                    <span id="statusText">Cloud sync: <span class="disconnected">not configured</span></span>
                </div>
                <div class="status-actions">
                    <button onclick="syncNow()" id="syncBtn"><i class="fas fa-sync"></i> Sync</button>
                </div>
            </div>

            <!-- User info & logout -->
            <div class="user-panel" id="userPanel">
                <span class="user-display" id="currentUserDisplay" style="display:none;">
                    <i class="fas fa-user"></i> <span id="userNameDisplay"></span>
                </span>
                <button class="logout-btn" id="logoutBtn" onclick="handleLogout()" style="display:none;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>

            <div id="sidebarSectionsContainer"></div>
            <button class="add-section-btn" id="addSectionBtn"><i class="fas fa-plus-circle"></i> Add section</button>
        </div>
    </aside>

    <!-- ============================================================
         MAIN CONTENT
         ============================================================ -->
    <main class="main" id="mainContent">
        <div id="mainSectionsContainer"></div>
    </main>

    <!-- ============================================================
         SCRIPTS
         ============================================================ -->
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
    <script src="ui.js"></script>
    <script src="crud.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Initialize auth first
        initAuth();

        const addBtn = document.getElementById('addSectionBtn');
        if (addBtn) {
            addBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                const name = prompt('Enter section name:');
                if (name && name.trim()) {
                    const idx = sections.length;
                    const size = getDefaultBoxSize(idx);
                    sections.push({
                        id: genId(),
                        name: name.trim(),
                        subs: [],
                        notes: [],
                        items: [],
                        width: size.width,
                        height: size.height,
                        x: size.x,
                        y: size.y
                    });
                    render();
                    const newSection = sections[sections.length - 1];
                    if (newSection) {
                        selectSection(newSection.id);
                    }
                }
            });
        }

        const toggleBtn = document.getElementById('toggleSidebarBtn');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', function() {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('hidden');
                this.innerHTML = sidebar.classList.contains('hidden') ?
                    '<i class="fas fa-chevron-right"></i> <span>Notes</span>' :
                    '<i class="fas fa-bars"></i> <span>Notes</span>';
            });
        }
    });

    window.addSectionFromMain = function() {
        const name = prompt('Section name:');
        if (name && name.trim()) {
            const idx = sections.length;
            const size = getDefaultBoxSize(idx);
            sections.push({
                id: genId(),
                name: name.trim(),
                subs: [],
                notes: [],
                items: [],
                width: size.width,
                height: size.height,
                x: size.x,
                y: size.y
            });
            render();
            const newSection = sections[sections.length - 1];
            if (newSection) selectSection(newSection.id);
        }
    };
    </script>

</body>
</html>
