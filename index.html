<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Notes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.svg" />
    <title>Notes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css?v=phone-ui-5" />
</head>
<body>
    <div class="login-overlay visible" id="loginOverlay">
        <section class="auth-card" aria-labelledby="authTitle">
            <h1 id="authTitle"><i class="fas fa-sticky-note"></i> Notes</h1>
            <p class="auth-subtitle">Sign in to your personal workspace</p>
            <p class="auth-message auth-error" id="authError"></p>
            <p class="auth-message auth-success" id="authSuccess"></p>
            <form id="loginForm" data-submit-action="login">
                <input id="loginUsername" autocomplete="username" placeholder="Username" required>
                <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" required>
                <button class="auth-btn" type="submit">Log in</button>
                <button class="auth-link" type="button" data-action="show-signup">Create an account</button>
            </form>
            <form id="signupForm" style="display:none" data-submit-action="signup">
                <input id="signupUsername" autocomplete="username" placeholder="Username" required>
                <input id="signupPassword" type="password" autocomplete="new-password" placeholder="Password" required>
                <input id="signupConfirmPassword" type="password" autocomplete="new-password" placeholder="Confirm password" required>
                <button class="auth-btn" type="submit">Create account</button>
                <button class="auth-link" type="button" data-action="show-login">Back to login</button>
            </form>
            <form id="changePasswordForm" style="display:none" data-submit-action="change-password">
                <h2>Change password</h2><input id="changeCurrentPassword" type="password" placeholder="Current password" required>
                <input id="changeNewPassword" type="password" placeholder="New password" required>
                <input id="changeConfirmNewPassword" type="password" placeholder="Confirm new password" required>
                <button class="auth-btn" type="submit">Update password</button><button class="auth-link" type="button" data-action="hide-login">Cancel</button>
            </form>
            <form id="deleteAccountForm" style="display:none" data-submit-action="delete-account">
                <h2>Delete account</h2><p class="auth-subtitle">This permanently removes your notes.</p>
                <input id="deleteUsername" readonly><input id="deletePassword" type="password" placeholder="Current password" required>
                <button class="auth-btn danger" type="submit">Delete my account</button><button class="auth-link" type="button" data-action="hide-login">Cancel</button>
            </form>
            <section id="adminPanel" style="display:none"><h2>Admin panel</h2><p class="auth-subtitle">Manage user accounts.</p><div id="adminLoading">Loading users...</div><div id="adminUserList"></div><button class="auth-link" type="button" data-onclick="hideAdminPanel()">Close</button></section>
            <div style="margin-top: 1rem; text-align: center; border-top: 1px solid #2a2a1a; padding-top: 1rem;">
                <button class="auth-link" type="button" data-action="offline" style="font-size: 0.85rem;"><i class="fas fa-database"></i> Continue offline</button>
            </div>
        </section>
    </div>

    <div class="sidebar-toggle-wrapper">
        <button id="toggleSidebarBtn"><i class="fas fa-bars"></i> <span>Notes</span></button>
    </div>

    <div class="save-indicator" id="saveIndicator">
        <i class="fas fa-check-circle"></i> Saved
    </div>

    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="status-panel" id="statusPanel">
                <div class="status-info">
                    <i class="fas fa-cloud"></i>
                    <span id="statusText">Cloud sync: <span class="disconnected">not configured</span></span>
                </div>
                <div class="user-actions" id="userActions" style="display:none"><span id="currentUserDisplay"></span><button class="user-action-btn" data-action="show-change-password" title="Change password"><i class="fas fa-key"></i></button><button class="user-action-btn" id="deleteMyAccountBtn" data-action="show-delete-account" title="Delete my account"><i class="fas fa-trash-alt"></i></button><button class="user-action-btn" id="adminPanelBtn" data-action="show-admin" title="Admin panel" style="display:none"><i class="fas fa-shield-alt"></i></button><button class="user-action-btn" data-action="logout" title="Log out"><i class="fas fa-sign-out-alt"></i></button></div><div class="status-actions">
<button data-action="pull" id="pullBtn"><i class="fas fa-download"></i> Pull</button>
                    <button data-action="push" id="pushBtn"><i class="fas fa-upload"></i> Push</button>
                </div>
            </div>
            <button class="sidebar-close-btn" id="sidebarCloseBtn" title="Close sidebar">
                <i class="fas fa-times"></i>
            </button>
            <div id="sidebarSectionsContainer"></div>
            <button class="add-section-btn" id="addSectionBtn"><i class="fas fa-plus-circle"></i> Add section</button>
        </div>
    </aside>

    <main class="main" id="mainContent">
        <div id="mainSectionsContainer"></div>
    </main>

    <nav class="mobile-dock" aria-label="Quick actions">
        <button class="mobile-dock-btn" id="mobileMenuBtn" type="button" aria-label="Open notes menu"><i class="fas fa-bars"></i><span>Library</span></button>
        <button class="mobile-add-btn" id="mobileAddSectionBtn" type="button" aria-label="Create a new section"><i class="fas fa-plus"></i><span>New section</span></button>
        <button class="mobile-dock-btn" id="mobileOrganizeBtn" type="button" aria-label="Organize cards"><i class="fas fa-th-large"></i><span>Organize</span></button>
    </nav>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
    <script src="ui.js"></script>
    <script src="crud.js"></script>
    <script src="shared.js"></script>
    <script src="events.js"></script>
    <script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(error => console.warn('Offline support could not be enabled:', error))); }</script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const sidebar = document.getElementById('sidebar');
        const sidebarBackdrop = document.getElementById('sidebarBackdrop');
        const toggleBtn = document.getElementById('toggleSidebarBtn');
        function setSidebarOpen(isOpen) {
            sidebar?.classList.toggle('hidden', !isOpen);
            sidebarBackdrop?.classList.toggle('visible', isOpen);
            toggleBtn?.setAttribute('aria-expanded', String(isOpen));
            if (toggleBtn) toggleBtn.innerHTML = isOpen ? '<i class="fas fa-bars"></i> <span>Notes</span>' : '<i class="fas fa-chevron-right"></i> <span>Notes</span>';
        }

        if (window.matchMedia('(max-width: 700px)').matches) {
            setSidebarOpen(false);
        }
        initAuth();
        initSyncButtons();
        const addBtn = document.getElementById('addSectionBtn');
        if (addBtn) {
            addBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                const name = prompt('Enter section name:');
                if (name && name.trim()) {
                    const idx = sections.length;
                    const size = getDefaultBoxSize(idx);
                    sections.push({
                        id: genId(),
                        name: name.trim(),
                        subs: [],
                        notes: [],
                        items: [],
                        width: size.width,
                        height: size.height,
                        x: size.x,
                        y: size.y
                    });
                    render();
                    const newSection = sections[sections.length - 1];
                    if (newSection) {
                        selectSection(newSection.id);
                    }
                }
            });
        }

        if (toggleBtn) {
            toggleBtn.addEventListener('click', function() {
                setSidebarOpen(sidebar?.classList.contains('hidden'));

            });
        }

        const closeBtn = document.getElementById('sidebarCloseBtn');
        if (closeBtn) {
            closeBtn.addEventListener('click', function() {
                setSidebarOpen(false);
            });
        }
        sidebarBackdrop?.addEventListener('click', function() { setSidebarOpen(false); });
        document.getElementById('mobileMenuBtn')?.addEventListener('click', function() { document.getElementById('toggleSidebarBtn')?.click(); });
        document.getElementById('mobileAddSectionBtn')?.addEventListener('click', function() { window.addSectionFromMain?.(); });
        document.getElementById('mobileOrganizeBtn')?.addEventListener('click', function() { if (typeof isSharedSectionsView !== 'undefined' && isSharedSectionsView) { selectedSharedSubsectionPath?.length ? window.organizeSharedSubsectionCanvas?.() : window.organizeSharedCanvas?.(); } else { window.organizeCanvas?.(); } });
    });

    window.addSectionFromMain = function() {
        const name = prompt('Section name:');
        if (name && name.trim()) {
            const idx = sections.length;
            const size = getDefaultBoxSize(idx);
            sections.push({
                id: genId(),
                name: name.trim(),
                subs: [],
                notes: [],
                items: [],
                width: size.width,
                height: size.height,
                x: size.x,
                y: size.y
            });
            render();
            const newSection = sections[sections.length - 1];
            if (newSection) selectSection(newSection.id);
        }
    };
    </script>

</body>
</html>
